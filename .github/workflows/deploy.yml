name: Email Worker production deploy (isolated)

on:
  workflow_run:
    workflows: ["Email service source CI (no deployment)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: parkmemoir-email-only-production
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == 'gritechomepm-art/parkmemoir-email-service' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify main tip and exact successful source CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {execFileSync} from "node:child_process";
          const repo="gritechomepm-art/parkmemoir-email-service";
          const headers={Authorization:"Bearer "+process.env.GH_TOKEN,Accept:"application/vnd.github+json"};
          async function gh(path){
            const r=await fetch("https://api.github.com/repos/"+repo+path,{headers});
            assert.equal(r.status,200,"GitHub API "+path+" "+r.status);
            return r.json();
          }
          const expected=process.env.EXPECTED_SHA;
          assert.match(expected,/^[0-9a-f]{40}$/);
          const checked=execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();
          assert.equal(checked,expected,"PR/branch head changed");
          const main=await gh("/git/ref/heads/main");
          assert.equal(main.object.sha,expected,"Source is not current main");
          const runs=await gh("/actions/workflows/ci.yml/runs?head_sha="+expected+"&per_page=20");
          assert.ok(runs.workflow_runs?.some(x=>
            x.head_sha===expected && x.head_branch==="main" &&
            x.event==="push" && x.status==="completed" && x.conclusion==="success"),
            "Exact main Source CI PASS is required");
          console.log("EMAIL_DEPLOY_SOURCE_GATE_PASS "+expected);
          NODE

      - name: Rerun all zero-credential source tests
        run: |
          node --check worker.mjs
          node --check scripts/deploy-email-worker.mjs
          node --test worker.test.mjs client/full-print-snapshot.test.mjs scripts/deploy-email-worker.test.mjs

      - name: Verify scoped Cloudflare credentials exist
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repo secret" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repo secret" && exit 1)
          echo "Both Cloudflare credentials are present; values are never printed"

      - name: Upload isolated Worker version; verify bindings; deploy; health check and rollback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-email-worker.mjs
